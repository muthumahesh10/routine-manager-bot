version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: routine_postgres
    environment:
      POSTGRES_USER: routine_user
      POSTGRES_PASSWORD: routine_password
      POSTGRES_DB: routine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: routine_redis
    ports:
      - "6379:6379"
    restart: always

  bot:
    build: .
    container_name: routine_bot
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build: .
    container_name: routine_worker
    command: celery -A tasks worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  beat:
    build: .
    container_name: routine_beat
    command: celery -A tasks beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data: