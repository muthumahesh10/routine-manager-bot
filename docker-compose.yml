version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: routine_postgres
    environment:
      POSTGRES_USER: routine_user
      POSTGRES_PASSWORD: routine_password
      POSTGRES_DB: routine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: routine_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data: